:root{
  --bg:#06170f; --bg2:#0a2418; --surface:rgba(13,43,30,.92); --surface2:#163f2c; --line:#245f43;

[hidden]{display:none!important}
.wm{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.wm img{width:min(82vw,380px);opacity:.08}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:10px var(--gr) 10px var(--gl);background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
.top img{width:40px;height:40px;border-radius:10px;flex:none}
.brand{min-width:0;flex:1}
.brand b{display:block;font:700 clamp(18px,5.6vw,24px)/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.brand b span{color:var(--gold)}
.brand small{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.icon-btn{flex:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon-btn svg,.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#view{position:relative;z-index:1;padding:16px 0 calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1{font:700 30px/1.05 var(--display);letter-spacing:.01em;margin:4px 0 0}
h2{font:600 22px/1.1 var(--display);margin:0}
h3{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .t{background:var(--surface2);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.tiles small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tiles b{display:block;font:500 26px/1.15 var(--mono);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:20px;padding:8px 14px;font:500 13px var(--body);cursor:pointer;min-height:36px}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:16px var(--body);letter-spacing:0;text-transform:none}
input.mono{font-family:var(--mono)}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 15px var(--body);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.full{width:100%}
.btn.warn{border-color:var(--down);color:var(--down)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;min-width:0;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:11px 4px;font:500 14px var(--body);cursor:pointer;min-height:44px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
.seg button.on[data-v="Buy"]{background:var(--up);color:#042313}
.seg button.on[data-v="Sell"]{background:var(--down);color:#2a0703}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0;color:inherit;text-decoration:none}
.row:last-child{border-bottom:0;padding-bottom:0}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;font-size:16px}
.row .l small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.pill{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.pill.buy{background:rgba(62,224,138,.16);color:var(--up)} .pill.sell{background:rgba(255,112,98,.16);color:var(--down)}
.pill.open{background:rgba(244,183,58,.16);color:var(--gold)} .pill.smp{background:rgba(147,191,168,.16);color:var(--muted)}
.grade{display:inline-block;min-width:22px;text-align:center;font:600 12px var(--body);padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-top:3px}
.brow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0;padding-bottom:0}
.brow .bl{min-width:0;font-weight:500}
.brow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.bbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bbar i{display:block;height:100%;border-radius:4px}
.bbar i.up{background:var(--up)} .bbar i.down{background:var(--down)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span:first-child{color:var(--muted)} .kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);text-decoration:none;font:500 11px var(--body);letter-spacing:.04em;border-radius:8px;min-height:48px}
.nav a.on{color:var(--gold)}
.nav a.add svg{width:26px;height:26px}
details.card>summary{cursor:pointer;font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none;min-height:24px}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:12px}
.lots{font:500 40px/1 var(--mono);color:var(--gold)}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--down);font-size:14px}
.warnbox{border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px 12px;font-size:13.5px}
.shot{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--gold-ink);font:600 14px var(--body);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100vw - 32px)}
.empty{text-align:center;padding:26px 16px}
.empty img{width:96px;height:96px;border-radius:22px;margin:0 auto 14px;display:block}
.empty p{color:var(--muted);margin:8px 0 16px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wk div{text-align:center;min-width:0}
svg.curve text{font:11px var(--mono);fill:var(--muted)}
.guard{border:1px solid var(--down);background:rgba(255,112,98,.12);border-radius:10px;padding:12px 14px;font-size:14.5px}
.guard b{color:var(--down);margin-right:6px}
.ck{display:flex;flex-direction:row;align-items:flex-start;gap:12px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--fg);padding:8px 0;min-height:44px;cursor:pointer}
.ck input{width:22px;height:22px;flex:none;padding:0;margin:0;accent-color:var(--gold)}
.zone{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.zone:last-of-type{border-bottom:0}
.zone .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:9px}
.zone.live .dot{background:var(--up)}
.zone.live b{color:var(--up)}
.zone .note{text-align:right}
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ins .pill{margin:2px 0 0;flex:none;min-width:48px;text-align:center}
.ins b{font-weight:600}
.hm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hm i{aspect-ratio:1;border-radius:5px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:500 11px var(--mono);color:var(--muted);font-style:normal}
.hm i.s2{background:var(--up);border-color:var(--up);color:#042313}
.hm i.s3{background:var(--down);border-color:var(--down);color:#2a0703}
.hm i.f{opacity:.3}
.hmh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;font:500 11px var(--mono);color:var(--muted);margin-bottom:5px}
.tvbox{height:440px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.tvbox .tradingview-widget-container,.tvbox .tradingview-widget-container__widget{height:100%;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--bg);border:1px solid var(--line)}
.legend .l2::before{background:var(--up);border-color:var(--up)}
.legend .l3::before{background:var(--down);border-color:var(--down)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}

<script>
(function(){
'use strict';
var $=function(s,el){return (el||document).querySelector(s)};
var $$=function(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var p2=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var num=function(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
var ds=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var todayStr=function(){return ds(new Date())};
var parseD=function(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
var weekStart=function(s){var d=parseD(s);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ds(d)};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var fmtDate=function(s){var d=parseD(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
var isoWeek=function(s){var d=parseD(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)};

var PAIRS=['EUR/USD','GBP/USD','XAU/USD','XAG/USD'];
var SHORT={'EUR/USD':'EURUSD','GBP/USD':'GBPUSD','XAU/USD':'Gold','XAG/USD':'Silver'};
var GROUP={'EUR/USD':'Forex','GBP/USD':'Forex','XAU/USD':'Metals','XAG/USD':'Metals'};
var DEC={'EUR/USD':5,'GBP/USD':5,'XAU/USD':2,'XAG/USD':3};
var MODELS=['Daily to H1','H4 to M15','H1 to M1'];
var SESSIONS=['Asia','London','New York','Other'];
var MISTAKES=['None','Early entry','Late entry','Moved stop','Skipped confirmation','Against weekly direction','Oversized','Exited early','Chased','Overtraded'];
var EMOTIONS=['Calm','Confident','Hesitant','FOMO','Revenge','Bored'];
var CONTRACT={'EUR/USD':100000,'GBP/USD':100000,'XAU/USD':100,'XAG/USD':5000};

var state={trades:[],daily:{},weekly:{},settings:null,ui:{period:'all',pair:'All',daily:todayStr(),week:weekStart(todayStr())}};
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
function load(){
  var d=store.get('mk_data',null)||{};
  var s=d.settings||{};
  state.settings={balance:s.balance!=null?s.balance:10000,risk:s.risk!=null?s.risk:1,contract:Object.assign({},CONTRACT,s.contract||{})};
  state.trades=d.trades||[];state.daily=d.daily||{};state.weekly=d.weekly||{};
}
function save(skipSync){
  if(!store.set('mk_data',{v:1,settings:state.settings,trades:state.trades,daily:state.daily,weekly:state.weekly}))toast('Browser storage is blocked. Export a backup before closing.');
  if(!skipSync&&typeof signedIn==='function'&&signedIn()){cloud.dirty=true;csave();schedSync()}
}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2400)}

var idb={db:null,mem:{},
  open:function(){var me=this;return new Promise(function(res){try{var rq=indexedDB.open('mk_img',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('i')};rq.onsuccess=function(){me.db=rq.result;res(true)};rq.onerror=function(){res(false)}}catch(e){res(false)}})},
  put:function(k,v){var me=this;me.mem[k]=v;return new Promise(function(res){if(!me.db)return res();try{var tx=me.db.transaction('i','readwrite');tx.objectStore('i').put(v,k);tx.oncomplete=res;tx.onerror=res}catch(e){res()}})},
  get:function(k){var me=this;return new Promise(function(res){if(!me.db)return res(me.mem[k]||null);try{var rq=me.db.transaction('i').objectStore('i').get(k);rq.onsuccess=function(){res(rq.result||me.mem[k]||null)};rq.onerror=function(){res(me.mem[k]||null)}}catch(e){res(me.mem[k]||null)}})},
  del:function(k){var me=this;delete me.mem[k];return new Promise(function(res){if(!me.db)return res();try{var tx=me.db.transaction('i','readwrite');tx.objectStore('i').delete(k);tx.oncomplete=res;tx.onerror=res}catch(e){res()}})}
};
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1000,s=Math.min(1,m/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function rOf(t){var e=num(t.entry),s=num(t.sl),x=num(t.exit);if(e==null||s==null||x==null||e===s)return null;return (x-e)/(e-s)}
var R=function(x){var a=Math.round(Math.abs(x)*100)/100;return (a>0?(x>0?'+':'-'):'')+a.toFixed(2)+'R'};
var cls=function(x){return x>0.004?'up':x<-0.004?'down':''};
function stats(list){
  var cl=list.filter(function(t){return t.r!=null}).sort(function(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))});
  var n=cl.length,net=0,gw=0,gl=0,w=0,l=0,be=0,peak=0,dd=0,curve=[0],ok=0,rn=0;
  cl.forEach(function(t){net+=t.r;if(t.r>0){w++;gw+=t.r}else if(t.r<0){l++;gl+=-t.r}else be++;if(t.rules==='Yes'||t.rules==='No')rn++;if(t.rules==='Yes')ok++;curve.push(net);peak=Math.max(peak,net);dd=Math.max(dd,peak-net)});
  return {n:n,w:w,l:l,be:be,net:net,win:n?w/n:0,exp:n?net/n:0,pf:gl?gw/gl:(gw?Infinity:0),dd:dd,curve:curve,avgW:w?gw/w:0,avgL:l?gl/l:0,comp:rn?ok/rn:0};
}
function brk(title,list,keyFn,keys){
  var rows=keys.map(function(k){var s=stats(list.filter(function(t){return t.r!=null&&keyFn(t)===k}));return {k:k,s:s}}).filter(function(x){return x.s.n});
  if(!rows.length)return '';
  var mx=Math.max.apply(null,rows.map(function(x){return Math.abs(x.s.net)}).concat([0.01]));
  return '<section class="card"><h3>'+title+'</h3>'+rows.map(function(x){return '<div class="brow"><div class="bl">'+esc(x.k)+'<small>'+x.s.n+' trade'+(x.s.n>1?'s':'')+' · '+Math.round(x.s.win*100)+'% win</small></div><div class="bbar"><i class="'+(x.s.net<0?'down':'up')+'" style="width:'+Math.max(4,Math.abs(x.s.net)/mx*100)+'%"></i></div><b class="mono '+cls(x.s.net)+'">'+R(x.s.net)+'</b></div>'}).join('')+'</section>';
}
function curveSvg(c){
  if(c.length<3)return '<p class="note">Close two trades to see your equity curve.</p>';
  var W=340,H=150,pl=38,pr=8,pt=10,pb=20;
  var mn=Math.min.apply(null,c.concat([0])),mx=Math.max.apply(null,c.concat([0])),sp=(mx-mn)||1;
  var x=function(i){return pl+(W-pl-pr)*i/(c.length-1)},y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/sp)};
  var pts=c.map(function(v,i){return x(i).toFixed(1)+','+y(v).toFixed(1)}).join(' ');
  var last=c[c.length-1],col=last>=0?'var(--up)':'var(--down)';

function groupAvg(list,keyFn,keys,min){
  var out=[];keys.forEach(function(k){var l=list.filter(function(t){return keyFn(t)===k});if(l.length>=min){var s=stats(l);out.push({k:k,n:l.length,avg:s.exp,win:s.win})}});return out;
}
function addCmp(out,name,list,keyFn,keys,min,advice){
  var g=groupAvg(list,keyFn,keys,min).sort(function(a,b){return b.avg-a.avg});
  if(g.length<2)return;
  var b=g[0],w=g[g.length-1];
  if(b.avg>0.15)out.push({tone:'up',title:'Best '+name,text:b.k+' averages '+R(b.avg)+' per trade over '+b.n+' trades ('+Math.round(b.win*100)+'% win).',w:b.avg*Math.sqrt(b.n)});
  if(w.avg<-0.15)out.push({tone:'down',title:'Weakest '+name,text:w.k+' averages '+R(w.avg)+' per trade over '+w.n+' trades.'+(advice?' '+advice:''),w:-w.avg*Math.sqrt(w.n)});
}
function addPair(out,title,aName,a,bName,b){
  if(a.length<2||b.length<2)return;
  var sa=stats(a).exp,sb=stats(b).exp,diff=sa-sb;
  out.push({tone:diff>0.3?'up':'note',title:title,text:aName+' average '+R(sa)+' over '+a.length+' trades, against '+R(sb)+' for '+bName+' over '+b.length+'.',w:Math.abs(diff)*Math.sqrt(Math.min(a.length,b.length))});
}

   +'<details class="card"><summary>One-time setup (about 5 minutes)</summary><div class="stack note"><p>1. Go to https://supabase.com, create a free account, and tap New project. Name it mktrades, set a database password, pick a nearby region, and wait about two minutes.</p><p>2. Open SQL Editor, tap New query, paste the code below, and tap Run.</p><textarea readonly id="cs-sql" class="mono" style="font-size:12px;min-height:120px">'+esc(CLOUD_SQL)+'</textarea><button class="btn sm" id="cs-copy" type="button">Copy code</button><p>3. Open Authentication, then Sign In / Providers, open Email, and turn off Confirm email. Save.</p><p>4. Open Project Settings, then API Keys (or API). Copy the Project URL and the anon public key (newer dashboards call it the publishable key). Paste both below, add your email and a password, and tap Create account.</p></div></details>'
   +'<div id="cloud-body" class="stack">'+cloudInner()+'</div></section>';
}
function doAuth(up){
  var url=$('#cs-url').value.trim(),key=$('#cs-key').value.trim(),em=$('#cs-email').value.trim(),pw=$('#cs-pw').value,er=$('#cs-err');
  er.hidden=true;
  if(!/^https:\/\/\S+$/.test(url)||!key||!em||pw.length<6){er.textContent='Fill in the project URL, the key, your email, and a password of at least 6 characters.';er.hidden=false;return}
  cloud.url=url.replace(/\/+$/,'');cloud.key=key;cloud.email=em;csave();
  var body=JSON.stringify({email:em,password:pw});
  var p=up?cfetch('/auth/v1/signup',{method:'POST',body:body}):cfetch('/auth/v1/token?grant_type=password',{method:'POST',body:body});
  p.then(jerr).then(function(j){
    if(!j.access_token){er.textContent='Account created. Confirm it from your email, then tap Sign in.';er.hidden=false;return}
    applySession(j);cloud.lastSync='';cloud.dirty=hasRealData();cstat.conflict=null;csave();toast('Signed in');
    renderCloud();return syncNow();
  }).catch(function(e){er.textContent=e.message==='Failed to fetch'?'Could not reach that project URL. Check it and your connection.':e.message;er.hidden=false});
}
function wireCloud(){
  var g=function(id){return document.getElementById(id)};
  if(g('cs-in'))g('cs-in').onclick=function(){doAuth(false)};
  if(g('cs-up'))g('cs-up').onclick=function(){doAuth(true)};
  if(g('cs-now'))g('cs-now').onclick=function(){syncNow()};
  if(g('cs-out'))g('cs-out').onclick=function(){cloud.access='';cloud.refresh='';cloud.uid='';cloud.exp=0;cloud.lastSync='';cloud.dirty=false;csave();cstat.conflict=null;cstat.msg='';renderCloud();toast('Signed out. Your data stays on this device.')};
  if(g('cs-copy'))g('cs-copy').onclick=function(){var ta=g('cs-sql');var ok=function(){toast('Code copied')},no=function(){ta.select();toast('Select the text and copy it')};try{navigator.clipboard.writeText(CLOUD_SQL).then(ok,no)}catch(e){no()}};
  var c=cstat.conflict;
  if(g('cc-merge'))g('cc-merge').onclick=function(){mergeDoc(c.data);cloud.lastSync=c.updated_at;cloud.dirty=true;csave();cstat.conflict=null;syncNow().then(refreshView)};
  if(g('cc-cloud'))g('cc-cloud').onclick=function(){applyDoc(c.data);cloud.lastSync=c.updated_at;cloud.dirty=false;csave();cstat.conflict=null;cstat.msg='Synced '+hhmm();renderCloud();refreshView()};
  if(g('cc-dev'))g('cc-dev').onclick=function(){cloud.lastSync=c.updated_at;cloud.dirty=true;csave();cstat.conflict=null;syncNow()};
}

var imp={rows:null};
function pn(s){s=String(s==null?'':s).replace(/[\s  ]/g,'');if(!s)return null;if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/,/g,'');else s=s.replace(',','.');var n=parseFloat(s);return isFinite(n)?n:null}
function normSym(s){var u=String(s||'').toUpperCase().replace(/[^A-Z]/g,'');if(u.indexOf('EURUSD')===0)return 'EUR/USD';if(u.indexOf('GBPUSD')===0)return 'GBP/USD';if(u.indexOf('XAUUSD')===0||u.indexOf('GOLD')===0)return 'XAU/USD';if(u.indexOf('XAGUSD')===0||u.indexOf('SILVER')===0)return 'XAG/USD';return null}
function pdt(s){var m=String(s||'').match(/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})[ T]+(\d{1,2}):(\d{2})/);return m?{date:m[1]+'-'+m[2]+'-'+m[3],time:p2(+m[4])+':'+m[5]}:null}
function colMap(low){
  var idx=function(f){var a=[];low.forEach(function(x,i){if(f(x))a.push(i)});return a};
  var times=idx(function(x){return x.indexOf('time')>=0}),prices=idx(function(x){return x.indexOf('price')>=0});
  return {sym:idx(function(x){return x==='symbol'||x==='item'||x==='instrument'})[0],type:idx(function(x){return x==='type'})[0],vol:idx(function(x){return x==='volume'||x==='size'||x==='lots'||x==='quantity'})[0],
    ot:times[0],ct:times[times.length-1],tc:times.length,op:prices[0],cp:prices[prices.length-1],pc:prices.length,
    sl:idx(function(x){return /^s\s*\/\s*l$|^sl$|stop/.test(x)})[0],tp:idx(function(x){return /^t\s*\/\s*p$|^tp$|take/.test(x)})[0],
    pos:idx(function(x){return x==='position'||x==='ticket'||x==='order'})[0],profit:idx(function(x){return x==='profit'})[0],comm:idx(function(x){return x==='commission'})[0],swap:idx(function(x){return x==='swap'})[0]};
}
function parseRows(rows,o){
  var out=[],sk={other:0,bad:0},H=null;
  rows.forEach(function(r){
    var low=r.map(function(c){return String(c).trim().toLowerCase()});
    var hasSym=low.indexOf('symbol')>=0||low.indexOf('item')>=0||low.indexOf('instrument')>=0;
    if(hasSym&&low.indexOf('type')>=0){
      var ok=low.indexOf('profit')>=0&&low.indexOf('direction')<0&&low.indexOf('deal')<0;
      H=ok?colMap(low):null;if(H&&(H.tc<2||H.pc<2))H=null;return;
    }
    if(!H||r.length<8)return;
    var typ=String(r[H.type]||'').trim().toLowerCase();if(typ!=='buy'&&typ!=='sell')return;
    var sym=normSym(r[H.sym]);if(!sym){sk.other++;return}
    var ot=pdt(r[H.ot]),ep=pn(r[H.op]),xp=pn(r[H.cp]);if(!ot||ep==null||xp==null){sk.bad++;return}
    var sl=pn(r[H.sl]),tp=pn(r[H.tp]);sl=sl>0?sl:null;tp=tp>0?tp:null;
    var pnl=(pn(r[H.profit])||0)+(H.comm!=null?pn(r[H.comm])||0:0)+(H.swap!=null?pn(r[H.swap])||0:0);
    var ticket=H.pos!=null?String(r[H.pos]).replace(/\D/g,''):'';
    var id='mt5-'+(ticket||(ot.date+ot.time+sym+typ+ep).replace(/[^A-Za-z0-9]/g,''));
    var t={id:id,date:ot.date,time:ot.time,pair:sym,dir:typ==='buy'?'Buy':'Sell',model:o.model,session:o.session,weekly:'',aligned:'',dailyBias:'',corr:'Not checked',setup:'Imported from MT5',entry:ep,sl:sl,tp:tp,exit:xp,riskPct:null,lots:pn(r[H.vol]),pnl:Math.round(pnl*100)/100,grade:'',mistake:'',emotion:'',rules:'',notes:'',img:false,sample:false,imported:true,ck:null,chk:null};
    t.r=sl!=null&&sl!==ep?rOf(t):null;out.push(t);
  });
  return {trades:out,sk:sk};
}
function splitCsv(l,d){var o=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function rowsFromText(text){
  if(/<table/i.test(text)){var d=new DOMParser().parseFromString(text,'text/html');return $$('tr',d).map(function(tr){return $$('td,th',tr).map(function(c){return (c.textContent||'').replace(/\s+/g,' ').trim()})})}
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()}),best=',',cnt=-1;
  [',',';','\t'].forEach(function(dl){var c=lines.slice(0,10).reduce(function(a,l){return a+l.split(dl).length},0);if(c>cnt){cnt=c;best=dl}});
  return lines.map(function(l){return splitCsv(l,best)});
}
function readText(f){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var b=new Uint8Array(fr.result),le=b[0]===0xFF&&b[1]===0xFE,be=b[0]===0xFE&&b[1]===0xFF;res(new TextDecoder(le?'utf-16le':be?'utf-16be':'utf-8').decode(b))};fr.onerror=rej;fr.readAsArrayBuffer(f)})}

  return '<section class="card stack"><h3>Import from MT5</h3><p class="note">On a computer, open MT5 and go to View, then Toolbox, then History. Choose your period, right-click the list, and pick Report, then HTML. A CSV file with the same columns also works. Pick that file here. Only EUR/USD, GBP/USD, Gold, and Silver trades are imported, and times stay in your broker server time.</p><div class="g2"><label>Model<select id="im-model">'+opts(MODELS,'H4 to M15')+'</select></label><label>Session<select id="im-session">'+opts(SESSIONS,'Other')+'</select></label></div><input id="im-file" type="file" accept=".html,.htm,.csv,.txt"><div id="im-out" class="stack"></div></section>';

function wireImport(){
  var f=$('#im-file');if(!f)return;
  function show(){
    var out=$('#im-out');if(!imp.rows){out.innerHTML='';return}
    var r=parseRows(imp.rows,{model:$('#im-model').value,session:$('#im-session').value});
    var have={};state.trades.forEach(function(t){have[t.id]=1});
    var fresh=r.trades.filter(function(t){return !have[t.id]}),dup=r.trades.length-fresh.length;
    if(!r.trades.length){out.innerHTML='<p class="err">No closed trades found. Use the Positions report from MT5 (HTML) or a CSV with symbol, type, volume, open and close time and price, S/L, T/P, and profit columns. Other symbols are skipped.</p>';return}
    var by={};fresh.forEach(function(t){by[SHORT[t.pair]]=(by[SHORT[t.pair]]||0)+1});
    var nosl=fresh.filter(function(t){return t.r==null}).length;
    var h='<div class="kv"><span>Ready to import</span><span class="mono">'+fresh.length+'</span></div><div class="kv"><span>By pair</span><span>'+Object.keys(by).map(function(k){return esc(k)+' '+by[k]}).join(', ')+'</span></div>';
    if(dup)h+='<div class="kv"><span>Already in your journal</span><span class="mono">'+dup+'</span></div>';
    if(r.sk.other)h+='<div class="kv"><span>Skipped other symbols</span><span class="mono">'+r.sk.other+'</span></div>';
    if(r.sk.bad)h+='<div class="kv"><span>Skipped rows without time or price</span><span class="mono">'+r.sk.bad+'</span></div>';
    if(nosl)h+='<p class="note">'+nosl+' trade'+(nosl>1?'s have':' has')+' no stop loss in the report, so R cannot be worked out. They show as Open until you edit them and add a stop. If you moved your stop, edit it for a true R.</p>';
    if(fresh.length)h+='<button class="btn pri full" id="im-go">Import '+fresh.length+' trade'+(fresh.length>1?'s':'')+'</button>';
    out.innerHTML=h;
    var go=$('#im-go');if(go)go.onclick=function(){state.trades=state.trades.concat(fresh);save();toast(fresh.length+' trades imported');location.hash='#trades'};
  }
  f.onchange=function(){var file=f.files&&f.files[0];if(!file)return;readText(file).then(function(t){imp.rows=rowsFromText(t);show()}).catch(function(){$('#im-out').innerHTML='<p class="err">That file could not be read.</p>'})};
  $('#im-model').onchange=show;$('#im-session').onchange=show;

function wireEmpty(){var b=$('#load-sample');if(b)b.onclick=function(){addSamples();route()}}
function periodCut(){var p=state.ui.period;if(p==='30d')return addDays(todayStr(),-30);if(p==='week')return weekStart(todayStr());return '0000'}

function vHome(){
  var all=state.trades;
  var top=guardHtml()+cloudBanner()+clockHtml();
  if(!all.length){setTimeout(wireEmpty,0);return top+consistencyCard()+emptyCard()}
  var cut=periodCut(),list=all.filter(function(t){return t.date>=cut}),s=stats(list);
  var open=list.filter(function(t){return t.r==null}).length;
  var smp=all.some(function(t){return t.sample});
  var chips=[['all','All time'],['30d','30 days'],['week','This week']].map(function(c){return '<button class="chip'+(state.ui.period===c[0]?' on':'')+'" data-p="'+c[0]+'">'+c[1]+'</button>'}).join('');
  var h=top+'<div class="chips" id="per">'+chips+'</div>';
  if(smp)h+='<div class="warnbox">You are looking at sample trades. <a href="#setup" class="gold">Remove them in Setup</a> before logging real ones.</div>';
  if(!s.n){return h+'<section class="card"><p class="muted">No closed trades in this period.</p></section>'}
  h+='<section class="tiles g2"><div class="t"><small>Net result</small><b class="'+cls(s.net)+'">'+R(s.net)+'</b></div><div class="t"><small>Win rate</small><b>'+Math.round(s.win*100)+'%</b></div><div class="t"><small>Expectancy</small><b class="'+cls(s.exp)+'">'+R(s.exp)+'</b></div><div class="t"><small>Profit factor</small><b>'+(s.pf===Infinity?'∞':s.pf.toFixed(2))+'</b></div></section>';
  h+=insightsCard(list)+consistencyCard();
  h+='<section class="card"><h3>Equity curve in R</h3>'+curveSvg(s.curve)+'</section>';
  h+='<section class="card"><h3>Quality</h3><div class="kv"><span>Rule compliance</span><span class="mono">'+Math.round(s.comp*100)+'%</span></div><div class="kv"><span>Max drawdown</span><span class="mono down">-'+s.dd.toFixed(2)+'R</span></div><div class="kv"><span>Average win / loss</span><span class="mono">+'+s.avgW.toFixed(2)+'R / -'+s.avgL.toFixed(2)+'R</span></div><div class="kv"><span>Closed / open</span><span class="mono">'+s.n+' / '+open+'</span></div></section>';
  h+=brk('By pair',list,function(t){return t.pair},PAIRS);
  h+=brk('By timeframe model',list,function(t){return t.model},MODELS);
  h+=brk('Weekly direction',list,alignKey,ALIGN_KEYS);
  h+=brk('Correlated pair check',list,function(t){return t.corr},['Confirmed','Diverged','Not checked']);
  var lbl={all:'All time','30d':'Last 30 days',week:'This week'}[state.ui.period];
  setTimeout(function(){wireAI(function(){return list},lbl)},0);
  return h;
}
function wireHome(){$$('#per .chip').forEach(function(b){b.onclick=function(){state.ui.period=b.dataset.p;route()}})}

function vTrades(){
  var all=state.trades;
  if(!all.length){setTimeout(wireEmpty,0);return '<h1>Trades</h1>'+emptyCard()}
  var f=state.ui.pair;
  var chips=['All'].concat(PAIRS).map(function(p){return '<button class="chip'+(f===p?' on':'')+'" data-f="'+p+'">'+(p==='All'?'All':SHORT[p])+'</button>'}).join('');
  var list=all.filter(function(t){return f==='All'||t.pair===f}).sort(function(a,b){return (b.date+(b.time||'')).localeCompare(a.date+(a.time||''))});
  var h='<h1>Trades</h1><div class="chips" id="pf">'+chips+'</div><section class="card">';
  h+=list.length?list.map(function(t){
    var r=t.r==null?'<span class="pill open">Open</span>':'<b class="mono '+cls(t.r)+'">'+R(t.r)+'</b>';
    return '<a class="row" href="#trade-'+t.id+'"><div class="l"><b>'+esc(SHORT[t.pair]||t.pair)+'<span class="pill '+(t.dir==='Buy'?'buy':'sell')+'">'+esc(t.dir)+'</span>'+(t.sample?'<span class="pill smp">Sample</span>':'')+(t.imported?'<span class="pill smp">Imported</span>':'')+'</b><small>'+fmtDate(t.date)+' · '+esc(t.model)+' · '+esc(t.session)+'</small></div><div class="r">'+r+'<div><span class="grade">'+esc(t.grade||'-')+'</span></div></div></a>'}).join(''):'<p class="muted">No trades for this pair yet.</p>';
  return h+'</section>';
}
function wireTrades(){$$('#pf .chip').forEach(function(b){b.onclick=function(){state.ui.pair=b.dataset.f;route()}})}

function vTrade(id){
  var t=state.trades.filter(function(x){return x.id===id})[0];
  if(!t)return '<h1>Trade not found</h1><a class="btn full" href="#trades">Back to trades</a>';
  var kv=function(k,v){return (v===''||v==null)?'':'<div class="kv"><span>'+k+'</span><span>'+esc(v)+'</span></div>'};
  var dc=DEC[t.pair]||5,f=function(v){return v==null||v===''?'':Number(v).toFixed(dc)};
  var h='<a class="muted" href="#trades">← All trades</a><section class="card"><h2>'+esc(t.pair)+'<span class="pill '+(t.dir==='Buy'?'buy':'sell')+'">'+esc(t.dir)+'</span>'+(t.sample?'<span class="pill smp">Sample</span>':'')+'</h2><div class="mono" style="font-size:34px;margin-top:6px"><span class="'+(t.r==null?'gold':cls(t.r))+'">'+(t.r==null?'Open':R(t.r))+'</span></div><p class="note">'+fmtDate(t.date)+(t.time?' · '+esc(t.time):'')+'</p></section>';
  h+='<section class="card"><h3>Setup</h3>'+kv('Model',t.model)+kv('Session',t.session)+kv('Weekly direction',t.weekly)+kv('Aligned with weekly',t.aligned)+kv('Daily bias',t.dailyBias)+kv('Correlated pair',t.corr)+kv('Setup',t.setup)+'</section>';
  h+='<section class="card"><h3>Execution</h3>'+kv('Entry',f(t.entry))+kv('Stop loss',f(t.sl))+kv('Take profit',f(t.tp))+kv('Exit',f(t.exit))+kv('Risk',t.riskPct!=null?t.riskPct+'%':'')+kv('Lots',t.lots)+kv('P/L',t.pnl!=null&&t.pnl!==''?'$'+t.pnl:'')+'</section>';
  h+='<section class="card"><h3>Review</h3>'+kv('Grade',t.grade)+kv('Followed rules',t.rules)+kv('Checklist',t.chk!=null?t.chk+' of 7 ticked':'')+kv('Mistake',t.mistake)+kv('Emotion',t.emotion)+kv('Notes',t.notes)+'</section>';
  if(t.img)h+='<section class="card"><h3>Screenshot</h3><img class="shot" id="shot" alt="Trade screenshot"></section>';
  h+='<div class="g2"><a class="btn" href="#edit-'+t.id+'">Edit</a><button class="btn warn" id="del">Delete</button></div>';
  setTimeout(function(){
    if(t.img)idb.get(t.id).then(function(d){var im=$('#shot');if(im&&d)im.src=d});
    var b=$('#del'),armed=false;if(b)b.onclick=function(){if(!armed){armed=true;b.textContent='Tap again to delete';return}
      state.trades=state.trades.filter(function(x){return x.id!==t.id});if(t.img)idb.del(t.id);save();toast('Trade deleted');location.hash='#trades'}
  },0);
  return h;
}

var draft=null,draftImg=undefined;
function newDraft(){var n=new Date();return {id:null,date:todayStr(),time:p2(n.getHours())+':'+p2(n.getMinutes()),pair:'EUR/USD',dir:'Buy',model:'H4 to M15',session:'London',weekly:'',aligned:'',alignedTouched:false,dailyBias:'',corr:'Not checked',setup:'',entry:'',sl:'',tp:'',exit:'',riskPct:String(state.settings.risk),lots:'',r:'',rManual:false,pnl:'',grade:'A',mistake:'None',emotion:'Calm',rules:'Yes',notes:'',img:false,ck:[],rulesTouched:false}}
function toDraft(t){var d=newDraft();Object.keys(t).forEach(function(k){if(t[k]!=null)d[k]=t[k]});['entry','sl','tp','exit','riskPct','lots','pnl'].forEach(function(k){d[k]=t[k]!=null?String(t[k]):''});d.r=t.r!=null?String(Math.round(t.r*100)/100):'';d.rManual=false;d.alignedTouched=true;d.ck=(t.ck||[]).slice();d.rulesTouched=true;return d}
function opts(list,val){return list.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function seg(f,list,val){return '<div class="seg" data-seg="'+f+'" role="group">'+list.map(function(o){return '<button type="button" data-v="'+esc(o)+'" class="'+(val===o?'on':'')+'">'+esc(o)+'</button>'}).join('')+'</div>'}
function field(label,inner){return '<div class="fld"><span>'+label+'</span>'+inner+'</div>'}
function inp(f,label,ph,mono){return '<label>'+label+'<input data-f="'+f+'" id="f-'+f+'" type="text" inputmode="decimal" autocomplete="off" placeholder="'+(ph||'')+'" class="'+(mono===false?'':'mono')+'" value="'+esc(draft[f])+'"></label>'}

function vAdd(editId){
  var t=editId?state.trades.filter(function(x){return x.id===editId})[0]:null;
  if(editId&&!t)return '<h1>Trade not found</h1><a class="btn full" href="#trades">Back to trades</a>';
  draft=t?toDraft(t):newDraft();draftImg=undefined;
  var d=draft;
  var h='<h1>'+(t?'Edit trade':'New trade')+'</h1>'+guardHtml();
  h+='<section class="card stack"><h3>Setup</h3><div class="g2">'+field('Pair','<select data-f="pair" id="f-pair">'+opts(PAIRS,d.pair)+'</select>')+field('Direction',seg('dir',['Buy','Sell'],d.dir))+'</div>'

  $('#b-copy').onclick=function(){bundle().then(function(j){var box=$('#b-box');box.value=j;var ok=function(){toast('Backup copied')},no=function(){box.select();toast('Select the text and copy it')};try{navigator.clipboard.writeText(j).then(ok,no)}catch(e){no()}})};
  $('#b-dl').onclick=function(){bundle().then(function(j){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='mktrades-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup file requested. If nothing downloads, use Copy backup.')}catch(e){toast('Use Copy backup instead')}})};
  $('#b-file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#b-box').value=r.result};r.readAsText(f)};
  var armed=false;
  $('#b-imp').onclick=function(){
    var er=$('#b-err'),b=$('#b-imp');er.hidden=true;var o;
    try{o=JSON.parse($('#b-box').value);if(!o||!Array.isArray(o.trades))throw 0}catch(e){er.textContent='That is not a valid MKtrades backup.';er.hidden=false;return}
    if(!armed){armed=true;b.textContent='Tap again to replace my current data';return}
    state.settings=Object.assign({},state.settings,o.settings||{});state.settings.contract=Object.assign({},CONTRACT,(o.settings||{}).contract||{});
    state.trades=o.trades;state.daily=o.daily||{};state.weekly=o.weekly||{};save();
    Promise.all(Object.keys(o.images||{}).map(function(k){return idb.put(k,o.images[k])})).then(function(){toast('Backup restored');location.hash='#home'})
  };
  wireCloud();wireImport();
  var a=$('#d-add'),m=$('#d-smp'),all=$('#d-all');
  if(a)a.onclick=function(){addSamples();route()};
  if(m)m.onclick=function(){state.trades=state.trades.filter(function(t){return !t.sample});save();toast('Sample trades removed');route()};
  var arm2=false;all.onclick=function(){if(!arm2){arm2=true;all.textContent='Tap again to erase all trades and notes';return}
    state.trades.forEach(function(t){if(t.img)idb.del(t.id)});state.trades=[];state.daily={};state.weekly={};save();toast('Everything erased');location.hash='#home'};
}

function route(){
  clearInterval(clockTimer);
  var h=(location.hash||'#home').slice(1),v=$('#view'),n='home',html='';
  if(h.indexOf('trade-')===0){n='trades';html=vTrade(h.slice(6))}
  else if(h.indexOf('edit-')===0){n='add';html=vAdd(h.slice(5))}
  else if(h==='trades'){n='trades';html=vTrades()}
  else if(h==='add'){n='add';html=vAdd(null)}
  else if(h==='daily'){n='daily';html=vDaily()}
  else if(h==='review'){n='review';html=vReview()}
  else if(h==='setup'){n='';html=vSetup()}
  else if(h==='market'){n='';html=vMarket()}
  else{html=vHome()}
  v.innerHTML=html;
  if(n==='home'){wireHome();startClock()}if(n==='trades'&&h==='trades')wireTrades();
  $$('.nav a').forEach(function(a){a.classList.toggle('on',a.dataset.n===n)});
}
var last='';
window.addEventListener('hashchange',function(){var cur=(location.hash||'#home');if(cur!==last)window.scrollTo(0,0);last=cur;route()});
load();last=location.hash||'#home';
idb.open().then(function(){route()});route();
window.addEventListener('online',function(){syncNow()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncNow()});
setInterval(function(){if(!document.hidden)syncNow()},60000);
setTimeout(function(){syncNow()},800);
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
</script>
